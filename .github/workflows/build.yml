name: Build
on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository source code
    - name: Checkout code
      uses: actions/checkout@v6

    # 2. Set up the Java Development Kit (JDK)
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    # 3. Set up Gradle (handles caching and build environment configuration)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Change wrapper permissions
      run: chmod +x ./gradlew

    # 4. Execute the Gradle build task to generate artifacts (JAR, WAR, etc.)
    - name: Build with Gradle
      run: ./gradlew build

    # 5. Upload the compiled artifact(s) to GitHub Actions
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: '${{ github.event.repository.name }}-${{ github.run_number }}'
        path: build/libs/
        archive: false
